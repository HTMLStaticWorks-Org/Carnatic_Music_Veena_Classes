<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <!-- Royal Imperial Gold Gradient -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8"/>
      <stop offset="25%" stop-color="#F5CE69"/>
      <stop offset="60%" stop-color="#E0A526"/>
      <stop offset="85%" stop-color="#C48712"/>
      <stop offset="100%" stop-color="#8F5C08"/>
    </linearGradient>

    <!-- Deep Teak & Rosewood Body Radial Gradient -->
    <radialGradient id="teakGlow" cx="42%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4A1C0E"/>
      <stop offset="45%" stop-color="#2D1107"/>
      <stop offset="80%" stop-color="#190803"/>
      <stop offset="100%" stop-color="#0E0301"/>
    </radialGradient>

    <!-- Resonator Kudam Rich Wood Texture -->
    <radialGradient id="kudamWood" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#D47A3B"/>
      <stop offset="35%" stop-color="#9C4A1A"/>
      <stop offset="70%" stop-color="#5E260A"/>
      <stop offset="100%" stop-color="#2A0E04"/>
    </radialGradient>

    <!-- Sacred Kumkum Crimson Gradient -->
    <radialGradient id="kumkumDot" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E52D37"/>
      <stop offset="70%" stop-color="#A3171E"/>
      <stop offset="100%" stop-color="#610B10"/>
    </radialGradient>

    <!-- Vibrating Golden Strings Linear Gradient -->
    <linearGradient id="vibrantString" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D48B16"/>
      <stop offset="45%" stop-color="#FFFDEB"/>
      <stop offset="75%" stop-color="#FCE182"/>
      <stop offset="100%" stop-color="#D48B16"/>
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="softGoldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ==========================================
       1. ROYAL CONSERVATORY MEDALLION BASE
       ========================================== -->
  <!-- Outer Gold Rim -->
  <circle cx="40" cy="40" r="38" fill="url(#teakGlow)" stroke="url(#goldSheen)" stroke-width="2"/>
  
  <!-- Concentric Filigree Ring (24 Sacred Shruti Beads) -->
  <circle cx="40" cy="40" r="35" fill="none" stroke="url(#goldSheen)" stroke-width="0.8" stroke-dasharray="1.5 3.0" opacity="0.85"/>
  <circle cx="40" cy="40" r="33.5" fill="none" stroke="url(#goldSheen)" stroke-width="0.5" opacity="0.45"/>

  <!-- ==========================================
       2. NADA HARMONIC SOUND WAVES (ACOUSTIC RIPPLES)
       ========================================== -->
  <path d="M 46 22 A 26 26 0 0 1 62 38" fill="none" stroke="url(#goldSheen)" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
  <path d="M 50 17 A 32 32 0 0 1 68 35" fill="none" stroke="url(#goldSheen)" stroke-width="1.0" stroke-linecap="round" opacity="0.50"/>
  <path d="M 18 44 A 26 26 0 0 1 34 60" fill="none" stroke="url(#goldSheen)" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
  <path d="M 14 48 A 32 32 0 0 1 30 64" fill="none" stroke="url(#goldSheen)" stroke-width="0.8" stroke-linecap="round" opacity="0.40"/>

  <!-- ==========================================
       3. THE SARASWATI VEENA (HANDCRAFTED ARTWORK)
       ========================================== -->
  
  <!-- Secondary Gourd (Suraikkai) Under Neck -->
  <ellipse cx="50" cy="28" rx="4.2" ry="3.0" transform="rotate(-38 50 28)" 
           fill="url(#kudamWood)" stroke="url(#goldSheen)" stroke-width="0.9"/>

  <!-- Resonator Kudam (Main Bowl at Bottom Left) -->
  <!-- 3D Layered Bowl -->
  <path d="M 16 54 C 12 47, 16 34, 28 34 C 35 34, 42 38, 43 45 C 44 52, 39 62, 29 63 C 21 64, 17 60, 16 54 Z" 
        fill="url(#kudamWood)" stroke="url(#goldSheen)" stroke-width="1.4"/>
  
  <!-- Kudam Ornamental Ivory/Gold Inlay Pattern -->
  <path d="M 20 40 C 24 37, 31 37, 35 41 C 34 44, 29 46, 23 45 Z" 
        fill="url(#goldSheen)" opacity="0.9"/>
  <!-- Central Kumkum Bindi on Inlay -->
  <circle cx="27.5" cy="42" r="1.6" fill="url(#kumkumDot)" stroke="#FFF2A3" stroke-width="0.4"/>

  <!-- Veena Neck (Dandi / Fingerboard) Rising Diagonally -->
  <path d="M 35 41 L 56 20 L 60 24 L 39 45 Z" 
        fill="url(#teakGlow)" stroke="url(#goldSheen)" stroke-width="1.1"/>

  <!-- Precision Brass Frets (Mettu) Along Fingerboard -->
  <line x1="39" y1="40" x2="41.5" y2="42.5" stroke="url(#goldSheen)" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="42" y1="37" x2="44.5" y2="39.5" stroke="url(#goldSheen)" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="45" y1="34" x2="47.5" y2="36.5" stroke="url(#goldSheen)" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="48" y1="31" x2="50.5" y2="33.5" stroke="url(#goldSheen)" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="51" y1="28" x2="53.5" y2="30.5" stroke="url(#goldSheen)" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="54" y1="25" x2="56.5" y2="27.5" stroke="url(#goldSheen)" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="57" y1="22" x2="59.5" y2="24.5" stroke="url(#goldSheen)" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Sculpted Sacred Yaazhi / Yali Head Crest at Pegbox -->
  <path d="M 57 21 C 58 17, 62 14, 66 16 C 68.5 17.5, 69 21, 65 22.5 C 62 23, 60 21, 58 24 C 60 27, 64 28, 66 25" 
        fill="none" stroke="url(#goldSheen)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Crown Jewel / Eye of Yaazhi -->
  <circle cx="64.5" cy="18" r="1.3" fill="#FFFBE6" stroke="#C48712" stroke-width="0.5"/>

  <!-- Turned Wooden Tuning Pegs (Birudais / Kunti) -->
  <line x1="55" y1="17" x2="60" y2="14" stroke="url(#goldSheen)" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="60.5" cy="13.5" r="1.5" fill="url(#goldSheen)"/>
  <line x1="60" y1="22" x2="65" y2="19" stroke="url(#goldSheen)" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="65.5" cy="18.5" r="1.5" fill="url(#goldSheen)"/>

  <!-- Brass Bridge (Kudhirai) Atop Resonator -->
  <path d="M 25 50 L 31 45 L 34 47.5 L 28 52.5 Z" fill="url(#goldSheen)" stroke="#8F5C08" stroke-width="0.6"/>

  <!-- 4 Radiant Melodic Strings Vibrating Across Bridge & Frets -->
  <line x1="26" y1="51.5" x2="57" y2="20.5" stroke="url(#vibrantString)" stroke-width="1.0" opacity="0.95"/>
  <line x1="28" y1="50" x2="58.5" y2="22" stroke="url(#vibrantString)" stroke-width="0.9" opacity="0.90"/>
  <line x1="30" y1="48.5" x2="60" y2="23.5" stroke="url(#vibrantString)" stroke-width="0.8" opacity="0.85"/>
  <line x1="32" y1="47" x2="61.5" y2="25" stroke="url(#vibrantString)" stroke-width="0.7" opacity="0.80"/>

  <!-- ==========================================
       4. RADIANT SWARA GLINT (MEETU PLUCK RESONANCE)
       ========================================== -->
  <g transform="translate(43, 35)">
    <!-- 4-Point Golden Star -->
    <path d="M 0 -4.5 Q 0 0 4.5 0 Q 0 0 0 4.5 Q 0 0 -4.5 0 Q 0 0 0 -4.5 Z" 
          fill="#FFFFFF" filter="url(#softGoldGlow)"/>
    <circle cx="0" cy="0" r="1.2" fill="url(#goldSheen)"/>
  </g>
</svg>
